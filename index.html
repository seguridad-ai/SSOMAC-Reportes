<!doctype html>
<html lang="es">
<head>
  <title>SSOMAC Digital | Login</title>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

</head>
<body data-page="login">
  <main class="login-shell">
    <section class="card login-card">
      <div class="brand">
        <div class="brand-mark">EDP</div>
        <div>
          <h1>SSOMAC Digital</h1>
          <p>Explo Drilling Perú</p>
        </div>
      </div>
      <form id="loginForm">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required placeholder="usuario@explodrillingperu.pe">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        <button type="submit">Ingresar</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
