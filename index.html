<!doctype html>
<html lang="es">
<head>
  <title>SSOMAC Digital | Login</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body data-page="login" class="login-page-v36">
  <div id="loginBgA" class="login-bg-v36 is-visible" aria-hidden="true"></div>
  <div id="loginBgB" class="login-bg-v36" aria-hidden="true"></div>
  <div class="login-shade-v36" aria-hidden="true"></div>

  <main class="login-shell login-shell-v36">
    <section class="login-card-v36" aria-label="Inicio de sesión SSOMAC Digital">
      <div class="login-corporate-v36">
        <img src="assets/img/logo-corporativo.jpg" alt="Explo Drilling Perú" class="login-corporate-logo-v36">
      </div>

      <div class="login-title-v36">
        <p class="eyebrow">Sistema Integrado de Gestión</p>
        <h1>SSOMAC Digital</h1>
        <p>Explo Drilling Perú</p>
      </div>

      <form id="loginForm">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required placeholder="usuario@explodrillingperu.pe">

        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">

        <button type="submit" class="login-button-v36">Ingresar</button>
        <p id="loginMessage" class="message"></p>
      </form>

      <div class="login-report-badge-v36">
        <img src="assets/img/logo-yo-reporto.png" alt="Yo Reporto">
        <div>
          <strong>Yo Reporto</strong>
          <span>Seguridad es responsabilidad de todos.</span>
        </div>
      </div>
    </section>

    <aside class="login-message-v36" aria-hidden="true">
      <span>SEGURIDAD · SALUD · MEDIO AMBIENTE · CALIDAD</span>
      <strong>Trabajamos hoy por un mañana más seguro.</strong>
      <p>Personas · Compromiso · Resultados</p>
    </aside>
  </main>

  <script src="app.js"></script>
  <script>
    (() => {
      const images = [
        'assets/img/fondo-1.jpg',
        'assets/img/fondo-2.png',
        'assets/img/fondo-3.jpg',
        'assets/img/fondo-4.jpg',
        'assets/img/fondo-5.jpeg',
        'assets/img/fondo-6.jpeg'
      ];
      const a = document.getElementById('loginBgA');
      const b = document.getElementById('loginBgB');
      if (!a || !b || !images.length) return;

      let index = Math.floor(Math.random() * images.length);
      let active = a;
      let hidden = b;

      const setBackground = (el, src) => { el.style.backgroundImage = `url("${src}")`; };
      setBackground(active, images[index]);
      setBackground(hidden, images[(index + 1) % images.length]);

      window.setInterval(() => {
        index = (index + 1) % images.length;
        setBackground(hidden, images[index]);
        hidden.classList.add('is-visible');
        active.classList.remove('is-visible');
        const tmp = active;
        active = hidden;
        hidden = tmp;
      }, 6500);
    })();
  </script>
</body>
</html>
